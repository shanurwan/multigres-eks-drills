---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/name: multigres-operator
  name: multigres-operator-alerts
spec:
  groups:
  - name: multigres-operator.rules
    rules:
    - alert: MultigresClusterReconcileErrors
      annotations:
        description: 'Controller {{ $labels.controller }} has had a non-zero reconcile
          error rate for {{ $labels.namespace }}/{{ $labels.name }} over the last
          5 minutes (current: {{ $value | humanize }}/s).'
        runbook_url: https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/MultigresClusterReconcileErrors.md
        summary: MultigresCluster controller is failing reconciles
      expr: rate(multigres_operator_reconcile_errors_total[5m]) > 0
      for: 5m
      labels:
        severity: warning
    - alert: MultigresClusterDegraded
      annotations:
        description: Cluster {{ $labels.name }} in namespace {{ $labels.namespace
          }} has been in phase "{{ $labels.phase }}" for more than 10 minutes.
        runbook_url: https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/MultigresClusterDegraded.md
        summary: MultigresCluster {{ $labels.name }} is degraded
      expr: multigres_operator_cluster_info{phase!="Healthy"} == 1
      for: 10m
      labels:
        severity: warning
    - alert: MultigresCellGatewayUnavailable
      annotations:
        description: Cell {{ $labels.cell }} in namespace {{ $labels.namespace }}
          has had zero ready MultiGateway replicas for 5 minutes. Traffic cannot be
          routed to this cell.
        runbook_url: https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/MultigresCellGatewayUnavailable.md
        summary: Cell {{ $labels.cell }} has zero ready gateway replicas
      expr: multigres_operator_cell_gateway_replicas{state="ready"} == 0
      for: 5m
      labels:
        severity: critical
    - alert: MultigresShardPoolDegraded
      annotations:
        description: Pool {{ $labels.pool }} of shard {{ $labels.shard }} in namespace
          {{ $labels.namespace }} has had fewer ready replicas than desired for more
          than 10 minutes.
        runbook_url: https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/MultigresShardPoolDegraded.md
        summary: Shard {{ $labels.shard }} pool {{ $labels.pool }} has fewer ready
          replicas than desired
      expr: multigres_operator_shard_pool_replicas{state="ready"} < multigres_operator_shard_pool_replicas{state="desired"}
      for: 10m
      labels:
        severity: warning
    - alert: MultigresWebhookErrors
      annotations:
        description: 'The {{ $labels.operation }} webhook for {{ $labels.resource
          }} has had a non-zero error rate for the last 5 minutes (current: {{ $value
          | humanize }}/s).'
        runbook_url: https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/MultigresWebhookErrors.md
        summary: Multigres admission webhook is returning errors
      expr: rate(multigres_operator_webhook_request_total{result="error"}[5m]) > 0
      for: 5m
      labels:
        severity: warning
    - alert: MultigresBackupStale
      annotations:
        description: The most recent backup for shard {{ $labels.shard }} in cluster
          {{ $labels.cluster }} (namespace {{ $labels.namespace }}) is {{ $value |
          humanizeDuration }} old. Check backup job health.
        runbook_url: https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/MultigresBackupStale.md
        summary: Shard {{ $labels.shard }} backup is older than 24 hours
      expr: multigres_operator_last_backup_age_seconds > 86400
      for: 30m
      labels:
        severity: warning
    - alert: MultigresRollingUpdateStuck
      annotations:
        description: Pool {{ $labels.pool }} of shard {{ $labels.shard }} in cell
          {{ $labels.cell }} (namespace {{ $labels.namespace }}) has been performing
          a rolling update for more than 30 minutes. Check for pods stuck in pending
          or crash-looping state.
        runbook_url: https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/MultigresRollingUpdateStuck.md
        summary: Rolling update stuck for {{ $labels.shard }}/{{ $labels.pool }}
      expr: multigres_operator_rolling_update_in_progress == 1
      for: 30m
      labels:
        severity: warning
    - alert: MultigresPoolPodsStuck
      annotations:
        description: Pool {{ $labels.pool }} of shard {{ $labels.shard }} in cell
          {{ $labels.cell }} (namespace {{ $labels.namespace }}) has pods that are
          not Ready for more than 15 minutes while the cell has Ready, schedulable
          nodes matching their node selector and required node affinity.
        runbook_url: https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/MultigresPoolPodsStuck.md
        summary: Pool pods stuck for {{ $labels.shard }}/{{ $labels.pool }}
      expr: multigres_operator_pool_pods_stuck > 0
      for: 15m
      labels:
        severity: warning
    - alert: MultigresDrainTimeout
      annotations:
        description: Shard {{ $labels.shard }} in cluster {{ $labels.cluster }} has
          had drain timeouts for the last 10 minutes. Pods may be stuck in a drain
          state. Check pod logs and topology server connectivity.
        runbook_url: https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/MultigresDrainTimeout.md
        summary: Drain operations are timing out for {{ $labels.shard }}
      expr: rate(multigres_operator_drain_operations_total{result="timeout"}[5m])
        > 0
      for: 10m
      labels:
        severity: warning
    - alert: MultigresReconcileSlow
      annotations:
        description: 'Controller {{ $labels.controller }} p99 reconcile duration has
          exceeded 30 seconds for the last 5 minutes (current: {{ $value | humanize
          }}s).'
        runbook_url: https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/MultigresReconcileSlow.md
        summary: Reconcile p99 latency exceeds 30 seconds
      expr: histogram_quantile(0.99, rate(controller_runtime_reconcile_time_seconds_bucket[5m]))
        > 30
      for: 5m
      labels:
        severity: warning
    - alert: MultigresControllerSaturated
      annotations:
        description: The {{ $labels.name }} controller work queue has been deeper
          than 50 items for more than 10 minutes. The operator cannot keep up with
          incoming events. Consider increasing MaxConcurrentReconciles.
        runbook_url: https://github.com/multigres/multigres-operator/blob/main/docs/monitoring/runbooks/MultigresControllerSaturated.md
        summary: Controller work queue is consistently deep
      expr: workqueue_depth{name=~"multigrescluster|tablegroup|shard|cell|toposerver"}
        > 50
      for: 10m
      labels:
        severity: warning
---
---
# ConfigMap: OTel Collector configuration
# Routes incoming OTLP signals: traces → Tempo, metrics → Prometheus.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    exporters:
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
      otlphttp/prometheus:
        endpoint: http://prometheus:9090/api/v1/otlp
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      telemetry:
        logs:
          level: warn
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          exporters: [otlphttp/prometheus]
---
# Deployment: OTel Collector
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.120.0
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - containerPort: 4318
              name: otlp-http
            - containerPort: 4317
              name: otlp-grpc
          startupProbe:
            httpGet:
              path: /
              port: 13133
            failureThreshold: 30
            periodSeconds: 2
          volumeMounts:
            - name: config
              mountPath: /etc/otel
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
# Service: OTel Collector
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - port: 4318
      targetPort: 4318
      name: otlp-http
    - port: 4317
      targetPort: 4317
      name: otlp-grpc
  type: ClusterIP
---
---
# ConfigMap: Tempo configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200

    distributor:
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4328
            grpc:
              endpoint: 0.0.0.0:4317

    metrics_generator:
      registry:
        external_labels:
          source: tempo
      storage:
        path: /tmp/tempo/generator/wal
        remote_write:
          - url: http://prometheus:9090/api/v1/write
            send_exemplars: true
      processor:
        service_graphs:
          wait: 10s
        span_metrics:
          dimensions: []

    storage:
      trace:
        backend: local
        local:
          path: /tmp/tempo/blocks
        wal:
          path: /tmp/tempo/wal
---
# Deployment: Tempo
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  labels:
    app: tempo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.7.2
          imagePullPolicy: IfNotPresent
          args:
            - "-config.file=/etc/tempo/tempo.yaml"
          ports:
            - containerPort: 3200
              name: tempo-http
            - containerPort: 4317
              name: otlp-grpc
          startupProbe:
            httpGet:
              path: /ready
              port: 3200
            failureThreshold: 30
            periodSeconds: 2
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
      volumes:
        - name: config
          configMap:
            name: tempo-config
---
# Service: Tempo
apiVersion: v1
kind: Service
metadata:
  name: tempo
spec:
  selector:
    app: tempo
  ports:
    - port: 3200
      targetPort: 3200
      name: tempo-http
    - port: 4317
      targetPort: 4317
      name: otlp-grpc
  type: ClusterIP
---
---
# ConfigMap: Grafana datasources (pre-configured with cross-linking)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus-uid
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: "60s"
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: tempo-uid
      - name: Tempo
        type: tempo
        uid: tempo-uid
        access: proxy
        url: http://tempo:3200
        editable: false
        jsonData:
          tracesToMetrics:
            datasourceUid: prometheus-uid
          serviceMap:
            datasourceUid: prometheus-uid
          nodeGraph:
            enabled: true
---
# ConfigMap: Grafana dashboard provisioning
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: "default"
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
# Deployment: Grafana
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            failureThreshold: 30
            periodSeconds: 2
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: "traceqlEditor,traceQLStreaming,correlations"
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboards-config
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboard-multigres
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboards-config
          configMap:
            name: grafana-dashboards-config
        - name: grafana-dashboard-multigres
          configMap:
            name: grafana-dashboard-multigres
---
# Service: Grafana
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
---
---
# ServiceAccount for the Prometheus instance managed by the Prometheus Operator.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
# ClusterRole: Allow Prometheus to discover scrape targets via ServiceMonitors.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
# ClusterRoleBinding: Bind prometheus SA to discovery role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: multigres-operator
---
# ClusterRoleBinding: Allow prometheus SA to read the operator's /metrics endpoint.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: multigres-operator-metrics-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: multigres-operator-metrics-reader
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: multigres-operator
---
# Prometheus: Managed instance — the Prometheus Operator creates a StatefulSet from this.
apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: multigres
spec:
  serviceAccountName: prometheus
  replicas: 1
  enableFeatures:
    - exemplar-storage
    - native-histograms
  enableOTLPReceiver: true
  serviceMonitorSelector:
    matchLabels:
      app.kubernetes.io/name: multigres-operator
  ruleSelector:
    matchLabels:
      app.kubernetes.io/name: multigres-operator
  resources:
    requests:
      memory: 200Mi
      cpu: 100m
  retention: 12h
---
# ServiceMonitor: Tell Prometheus to scrape the operator's metrics endpoint.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: multigres-operator
  labels:
    app.kubernetes.io/name: multigres-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: multigres-operator
  endpoints:
    - port: https
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
---
# ServiceMonitor: Scrape postgres_exporter metrics from shard pool headless Services.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shard-pool-postgres-exporter
  labels:
    app.kubernetes.io/name: multigres-operator
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app.kubernetes.io/name: multigres
      app.kubernetes.io/component: shard-pool
  endpoints:
    - port: metrics
      scheme: http
      path: /metrics
---
# Service: ClusterIP service for the managed Prometheus pods.
# The operator creates a headless "prometheus-operated" service; this provides
# a stable ClusterIP for port-forwarding and inter-service communication.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
    prometheus: multigres
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  type: ClusterIP

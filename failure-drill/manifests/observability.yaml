# The multigres-operator's own monitoring stack, rendered from commit
# c9ef95f1351421a8579f5144e2ce2b76708236df (the 'current' release tested here):
#   kubectl kustomize config/monitoring, followed by config/deploy-observability/
#   {otel-collector,tempo,grafana,prometheus}.yaml. The operator itself is not included.
# Apply into the multigres-operator namespace after the Prometheus Operator v0.80.0 bundle.
apiVersion: v1
data:
  cluster-health.json: |
    {
        "annotations": {
            "list": []
        },
        "description": "MultigresCluster topology health: cluster phase, cell gateways, shard pools, and TopoServer",
        "editable": true,
        "fiscalYearStartMonth": 0,
        "graphTooltip": 1,
        "links": [
            {
                "asDropdown": false,
                "icon": "external link",
                "tags": [],
                "title": "Operator Overview",
                "type": "link",
                "url": "/d/multigres-operator-overview"
            },
            {
                "asDropdown": false,
                "icon": "external link",
                "tags": [],
                "title": "Data Plane",
                "type": "link",
                "url": "/d/multigres-data-plane"

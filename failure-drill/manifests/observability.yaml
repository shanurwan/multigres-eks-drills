            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus-uid"
              },
              "editorMode": "code",
              "exemplar": true,
              "expr": "sum by (multigres_cluster, job, db_namespace, status) (sum by (job, instance, db_namespace, status) (histogram_count(rate(mg_gateway_query_duration_seconds{job=~\"multigateway|minigres\"}[$__rate_interval]))) * on (job, instance) group_left (multigres_cluster) max by (job, instance, multigres_cluster) (target_info{job=~\"multigateway|minigres\"}))",
              "legendFormat": "{{multigres_cluster}} {{job}} {{db_namespace}} [{{status}}]",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "SQL Query Rate",
          "type": "timeseries"
        },
